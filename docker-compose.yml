services:
  db:
    image: postgres:16-alpine
    container_name: ttm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ttm
      POSTGRES_PASSWORD: ttm
      POSTGRES_DB: ttm
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${TTM_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttm -d ttm"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: ttm-ollama
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${TTM_OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-bootstrap:
    image: ollama/ollama:latest
    container_name: ttm-ollama-bootstrap
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling model $$OLLAMA_MODEL..."
        ollama pull "$$OLLAMA_MODEL" || echo "Model pull failed — AI will use rule-based fallbacks"
        echo "Done."
    restart: "no"

  backend:
    build: ./backend
    container_name: ttm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://ttm:ttm@db:5432/ttm
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-please-32-chars-min}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_TIMEOUT: 30
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TTM_API_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: ttm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${TTM_WEB_PORT:-80}:80"

volumes:
  db_data:
  ollama_data:
