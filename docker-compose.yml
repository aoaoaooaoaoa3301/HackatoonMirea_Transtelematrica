services:
  db:
    image: postgres:16-alpine
    container_name: ttm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ttm
      POSTGRES_PASSWORD: ttm
      POSTGRES_DB: ttm
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${TTM_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttm -d ttm"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: ttm-ollama
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${TTM_OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-bootstrap:
    image: ollama/ollama:latest
    container_name: ttm-ollama-bootstrap
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ai/gemma4:E4B}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling model $$OLLAMA_MODEL..."
        ollama pull "$$OLLAMA_MODEL" || echo "Model pull failed — AI will use rule-based fallbacks"
        echo "Done."
    restart: "no"

  backend:
    build: ./backend
    container_name: ttm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://ttm:ttm@db:5432/ttm
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-please-32-chars-min}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ai/gemma4:E4B}
      LLM_PROVIDER: ${LLM_PROVIDER:-docker_model}
      DOCKER_MODEL_URL: ${DOCKER_MODEL_URL:-http://model-runner.docker.internal}
      OLLAMA_TIMEOUT: 30
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-qwen/qwen-2.5-7b-instruct}
      OPENAI_COMPATIBLE_TIMEOUT: ${OPENAI_COMPATIBLE_TIMEOUT:-60}
      OPENAI_COMPATIBLE_REFERER: ${OPENAI_COMPATIBLE_REFERER:-http://localhost}
      OPENAI_COMPATIBLE_APP_TITLE: ${OPENAI_COMPATIBLE_APP_TITLE:-TTM Task Assistant}
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN:-change-me}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TTM_API_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: ttm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${TTM_WEB_PORT:-80}:80"

  bot:
    build: ./bot
    container_name: ttm-telegram-bot
    restart: unless-stopped
    profiles: ["telegram"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKEND_URL: http://backend:8000
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN:-change-me}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  ollama_data:
